<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Bootleg Toys — Andrew Berg</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #16181c; color: #c9ccd2; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hint { position: fixed; left: 16px; bottom: 16px; opacity: 0.7; pointer-events: none; }
    #panel { position: fixed; left: 16px; top: 16px; bottom: 48px; width: 220px; display: flex; flex-direction: column; gap: 8px; }
    #filter { font: inherit; color: inherit; background: #22252b; border: 1px solid #33363d; border-radius: 4px; padding: 6px 8px; }
    #robots { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
    #robots li { padding: 2px 8px; border-radius: 3px; cursor: pointer; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #robots li:hover { opacity: 1; background: #22252b; }
    #robots li.current { opacity: 1; background: #33363d; }
    /* The belt fills the page on its own; the panel and hint are the viewer's. */
    [data-mode="kitbash"] #panel, [data-mode="kitbash"] #hint, [data-mode="kitbash"] #parts { display: none; }
    #parts { position: fixed; right: 16px; top: 16px; max-height: calc(100% - 64px); width: 200px; overflow-y: auto; display: flex; flex-direction: column; }
    #parts label { display: flex; gap: 6px; align-items: center; padding: 1px 0; cursor: pointer; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #parts label:has(:checked), #parts label:hover { opacity: 1; }
    #parts input { margin: 0; accent-color: #c9ccd2; }
    .thumbnail #hint, .thumbnail #panel, .no-robots #panel, .thumbnail #parts, .no-robots #parts { display: none; }
    /* The held figure's card: a sheet of card stock over the blurred belt,
       laid out like a page from a kit's manual. The canvas sits over it,
       cleared to show it, and the leader lines over that. */
    canvas { position: fixed; inset: 0; z-index: 2; }
    #panel, #hint, #parts { z-index: 4; }
    :root:not(.holding) :is(#blurred, #card, #leaders) { display: none; }
    #blurred { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    #card {
      --ink: #1d1e21; --accent: #1d1e21;
      position: fixed; inset: 28px; z-index: 1; box-sizing: border-box; overflow: hidden;
      display: grid; grid-template-columns: minmax(190px, 21%) 1fr minmax(190px, 21%); grid-template-rows: auto 1fr 1fr auto;
      gap: 18px 32px; padding: 22px 28px 16px;
      color: var(--ink); border-radius: 18px;
      background-color: #f3f0ea;
      background-image: linear-gradient(rgba(29, 30, 33, 0.055) 1px, transparent 1px), linear-gradient(90deg, rgba(29, 30, 33, 0.055) 1px, transparent 1px);
      background-size: 24px 24px; background-position: -1px -1px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset, 0 0 0 1px rgba(29, 30, 33, 0.08), 0 24px 60px rgba(29, 30, 33, 0.28), 0 4px 12px rgba(29, 30, 33, 0.12);
    }
    #card header { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; background: var(--ink); color: #f3f0ea; border-radius: 999px; padding: 6px 26px 6px 6px; }
    #card .code { background: #f3f0ea; color: var(--ink); border-radius: 999px; padding: 4px 16px; font-weight: 700; letter-spacing: 0.04em; font-size: 15px; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
    #card h1 { margin: 0; flex: 1; font: italic 800 30px/1.1 "Avenir Next Condensed", "Helvetica Neue", "Arial Narrow", sans-serif; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #card header small { font-size: 10px; letter-spacing: 0.14em; opacity: 0.7; text-transform: uppercase; }
    #card .watermark { position: absolute; right: -0.04em; bottom: -0.2em; font: italic 800 220px/1 "Avenir Next Condensed", "Helvetica Neue", "Arial Narrow", sans-serif; color: transparent; -webkit-text-stroke: 1.5px rgba(29, 30, 33, 0.07); pointer-events: none; white-space: nowrap; }
    #stage { grid-column: 2; grid-row: 2 / 4; min-height: 0; }
    .callout { position: relative; align-self: center; background: #fbfaf7; border: 1px solid rgba(29, 30, 33, 0.28); border-radius: 10px; padding: 10px 12px 10px; transition: border-color 0.15s, opacity 0.15s; }
    .callout[data-part="head"] { grid-column: 1; grid-row: 2; }
    .callout[data-part="legs"] { grid-column: 1; grid-row: 3; }
    .callout[data-part="arms"] { grid-column: 3; grid-row: 2; }
    .callout[data-part="body"] { grid-column: 3; grid-row: 3; }
    .callout h2 { margin: 0 0 6px; display: flex; align-items: center; gap: 6px; font: 700 14px/1.2 "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Avenir Next", sans-serif; }
    .callout h2 i { width: 10px; height: 10px; background: var(--accent); flex: none; }
    .callout .window { aspect-ratio: 4 / 3; }
    .callout p { margin: 6px 0 0; font-size: 11px; line-height: 1.35; opacity: 0.75; }
    .callout p small { display: block; font: 10px/1.4 "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #card.hovering .callout:not(.active) { opacity: 0.55; }
    #card .callout.active { border-color: var(--ink); }
    #card footer { grid-column: 1 / -1; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.5; }
    #leaders { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; overflow: visible; }
    #leaders polyline { fill: none; stroke: #1d1e21; stroke-opacity: 0.6; stroke-width: 1; }
    /* Where a later line crosses, cut a clear gap out of the earlier one. */
    #leaders mask .gaps polyline { fill: none; stroke: black; stroke-width: 7; stroke-linejoin: round; }
    #leaders circle { fill: #f3f0ea; stroke: #1d1e21; stroke-width: 1.25; }
    #leaders .active polyline { stroke-opacity: 1; stroke-width: 1.5; }
    /* On a narrow page the callouts go two above and two below. */
    @media (max-width: 760px) {
      #card { inset: 10px; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto 1fr auto auto; gap: 10px; padding: 10px 10px 8px; border-radius: 14px; }
      #card header { padding-right: 14px; gap: 10px; }
      #card .code { font-size: 12px; padding: 3px 10px; }
      #card h1 { font-size: 20px; }
      #card header small, #card .watermark { display: none; }
      #stage { grid-column: 1 / -1; grid-row: 3; }
      .callout { padding: 7px 8px; }
      .callout[data-part="head"] { grid-column: 1; grid-row: 2; }
      .callout[data-part="arms"] { grid-column: 2; grid-row: 2; }
      .callout[data-part="legs"] { grid-column: 1; grid-row: 4; }
      .callout[data-part="body"] { grid-column: 2; grid-row: 4; }
      .callout .window { aspect-ratio: 16 / 9; }
      .callout h2 { font-size: 12px; margin-bottom: 4px; }
      .callout p { font-size: 10px; margin-top: 4px; }
    }
    /* Outline the page while a file is dragged over it. */
    .dragging body { box-shadow: inset 0 0 0 2px #c9ccd2; }
  </style>
</head>
<body>
<div id="panel">
  <input id="filter" type="search" placeholder="Filter robots" aria-label="Filter robots" autocomplete="off">
  <ul id="robots"></ul>
</div>
<div id="parts" aria-label="Parts"></div>
<div id="hint">↑ ↓ to step through robots · drag to orbit · scroll to zoom · drop a .glb or .gltf to load it</div>
<canvas id="blurred"></canvas>
<div id="card">
  <header><span class="code"></span><h1></h1><small>Bootleg resin kit</small></header>
  <div class="watermark"></div>
  <div id="stage"></div>
  <section class="callout" data-part="head"><h2></h2><div class="window"></div><p></p></section>
  <section class="callout" data-part="legs"><h2></h2><div class="window"></div><p></p></section>
  <section class="callout" data-part="arms"><h2></h2><div class="window"></div><p></p></section>
  <section class="callout" data-part="body"><h2></h2><div class="window"></div><p></p></section>
  <footer></footer>
</div>
<svg id="leaders"></svg>
<script type="module" src="./src/main.js"></script>
</body>
</html>
