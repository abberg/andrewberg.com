<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
  <title>Sky Castle Gardener — Andrew Berg</title>
  <style>
    @font-face {
      font-family: 'Troika';
      src: url('troika.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    .comfortaa-regular {
      font-family: "Comfortaa", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
    }

    html, body { margin: 0; height: 100%; overflow: hidden; background: #a9d2e8; }
    canvas { display: block; touch-action: none; }
    /* The controls along the bottom once in the garden (src/hint.ts): × or H
       hides them, remembered. Clicks pass through to the view except on ×. */
    #controls { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); width: max-content;
      max-width: calc(100vw - 32px); box-sizing: border-box; padding: 6px 8px 6px 14px; border-radius: 6px;
      background: rgba(31, 31, 31, 0.7); color: #eee; font-size: 13px; line-height: 1.9; text-align: center; pointer-events: none; }
    #controls .close { pointer-events: auto; margin-left: 0.5em; padding: 0 0.45em; border: 0; border-radius: 4px;
      background: none; color: inherit; font: inherit; font-size: 1.25em; line-height: 1.3; vertical-align: -0.1em; cursor: pointer; opacity: 0.7; }
    #controls .close:hover { opacity: 1; background: rgba(255, 255, 255, 0.12); }
    #controls .close:focus-visible { outline: 2px solid #98cc2f; outline-offset: 1px; opacity: 1; }
    /* The tuning panel top left, the music on or off top right (src/speaker.ts),
       above the pause menu so it works while paused. */
    body .lil-gui.autoPlace { right: auto; left: 15px; }
    #speaker { position: fixed; top: 10px; right: 12px; z-index: 1500; display: grid; place-items: center; width: 40px; height: 40px;
      padding: 0; border: 1px solid rgba(187, 184, 138, 0.45); border-radius: 10px; background: rgba(31, 31, 31, 0.7);
      color: #ece8c4; cursor: pointer; }
    #speaker:hover { background: rgba(31, 31, 31, 0.85); }
    #speaker:focus-visible { outline: 2px solid #98cc2f; outline-offset: 2px; }
    #speaker svg { width: 22px; height: 22px; }
    #speaker .off, #speaker[aria-pressed="true"] .on { display: none; }
    #speaker[aria-pressed="true"] .off { display: inline; }
    /* Keycaps and the mouse, on the start screen and in the controls. Each
       control stays on one line; the lines wrap between them. */
    .control { white-space: nowrap; }
    .sep { margin: 0 0.35em; opacity: 0.6; }
    kbd { display: inline-block; min-width: 1.7em; box-sizing: border-box; margin: 0 1px; padding: 0 0.45em;
      border: 1px solid rgba(187, 184, 138, 0.55); border-bottom-width: 3px; border-radius: 5px;
      background: rgba(20, 14, 4, 0.45); color: #ece8c4; font: inherit; font-size: 0.85em; line-height: 1.6; text-align: center; }
    .mouse { width: 0.85em; height: 1.3em; margin-right: 0.15em; vertical-align: -0.3em; color: #ece8c4; }
    /* Loading, then the start screen (src/start.ts): shown from the first byte
       over the carved relief while the garden's built, then waiting for a click,
       tap or key to enter it, when it fades away. */
    #start { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      background: center no-repeat url("relief.jpeg"); background-size: cover; color: #fff; text-align: center;
      font-size: 15px; line-height: 1.5; transition: opacity 0.8s; }
    #start[data-state="ready"] {  cursor: pointer; }
    #start[data-state="gone"] { opacity: 0; pointer-events: none; }
    #start h1 { margin: 0 0 18px; font-family: 'Troika', 'Impact', sans-serif; display: flex; flex-direction: column; text-align: left;}
    /* Full size from about 1350px wide, scaled down with the window below that
       so "Gardener" always fits (the indent scales with it). */
    #start h1 .line-1 {font-size: min(8rem, 9.5vw); line-height: 0.8; transform: rotate(-1deg);}
    #start h1 .line-2 {font-size: min(16rem, 19vw); line-height: 0.8; padding-inline-start: 0.1875em; transform: rotate(-1deg); letter-spacing:-2%;}
    #start .bar { width: min(220px, 60vw); height: 2px; margin: 0 auto 10px; background: rgba(187, 184, 138, 0.3); overflow: hidden; }
    #start .bar span { display: block; height: 100%; width: 0; background: #bbb88a; transition: width 0.2s; }
    #start .status { margin: 0; color: #bbb88a; font-size: 13px; font-style: italic; }
    /* The loader and what replaces it share one space below the title, as tall
       as the taller of the two, so the title doesn't move when they swap. */
    #start .below { display: grid; }
    #start .below > * { grid-area: 1 / 1; align-self: start; }
    #start[data-state="ready"] .loader, #start:not([data-state="ready"]) .ready { visibility: hidden; }
    #start .enter { display: block; border: 0; font: inherit; color: inherit; cursor: pointer; }
    #start .enter { margin: 2px auto 0; padding: 10px 26px; border-radius: 999px; background: rgba(76, 137, 15, 0.92);
      box-shadow: 0 6px 24px rgba(30, 40, 60, 0.18); font-size: 18px; }
    #start .enter:hover { background: rgb(76, 137, 15); }
    #start .ready {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    #start .keys { margin-block: 0; color: #bbb88a; font-size: 14px;}
    #start .keys .touch { display: block; }
    #start button:focus-visible { outline: 2px solid #98cc2f; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      #start { transition: opacity 0.4s; }
      #start .bar span { transition: none; }
    }
    /* The rest of the furniture waits until the garden's entered. */
    body:not([data-entered]) #controls, body:not([data-entered]) .lil-gui.root, body:not([data-entered]) #speaker { visibility: hidden; }
    /* The thumbnail capture (?thumbnail=1) shows the garden alone. */
    body[data-thumbnail] #controls, body[data-thumbnail] .lil-gui.root, body[data-thumbnail] #speaker, body[data-thumbnail] #start { display: none !important; }
  </style>
</head>
<body class="comfortaa-regular">
<div id="start" data-state="loading">
  <div>
    <h1><span class="line-1">Sky Castle</span><span class="line-2">Gardener</span></h1>
    <div class="below">
      <div class="loader">
        <div class="bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
        <p class="status" role="status">Loading</p>
      </div>
      <div class="ready">
        <button class="enter" type="button">Click to enter</button>
        <p class="keys"><span class="control"><svg class="mouse" viewBox="0 0 16 24" role="img" aria-label="Mouse"><rect x="1.5" y="1.5" width="13" height="21" rx="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="8" y1="5.5" x2="8" y2="9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> to look</span><span class="sep" aria-hidden="true">·</span><span class="control"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to walk</span><span class="sep" aria-hidden="true">·</span><span class="control"><kbd>Shift</kbd> to run</span><span class="sep" aria-hidden="true">·</span><span class="control"><kbd>Esc</kbd> to pause</span></p>
      </div>
    </div>
  </div>
</div>
<button id="speaker" type="button" aria-label="Mute music" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" fill-opacity="0.15"/><g class="on"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></g><g class="off"><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></g></svg></button>
<div id="controls" role="note" aria-label="Controls"><span class="control"><svg class="mouse" viewBox="0 0 16 24" role="img" aria-label="Mouse"><rect x="1.5" y="1.5" width="13" height="21" rx="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="8" y1="5.5" x2="8" y2="9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> to look, wheel to zoom</span><span class="sep" aria-hidden="true">·</span><span class="control"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move</span><span class="sep" aria-hidden="true">·</span><span class="control"><kbd>Shift</kbd> to run</span><span class="sep" aria-hidden="true">·</span><span class="control"><kbd>E</kbd> to pick or throw fruit</span><span class="sep" aria-hidden="true">·</span><span class="control">walk into stone to shove</span><span class="sep" aria-hidden="true">·</span><span class="control"><kbd>R</kbd> to reset stones</span><span class="sep" aria-hidden="true">·</span><span class="control"><kbd>Esc</kbd> to pause</span><span class="sep" aria-hidden="true">·</span><span class="control"><kbd>M</kbd> music</span><span class="sep" aria-hidden="true">·</span><span class="control"><kbd>H</kbd> to hide<button class="close" type="button" aria-label="Hide controls">×</button></span></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
