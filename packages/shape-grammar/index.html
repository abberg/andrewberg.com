<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Shape Grammar — Andrew Berg</title>
  <style>
    :root { --paper: #000; --ink: #fff; --accent: #E0352B; --muted: #8A8A8A; }
    html { background: var(--paper); color: var(--ink); font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    body { margin: 0 auto; padding: 40px 24px 64px; max-width: 1280px; }
    header { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 40px; text-align: center; }
    h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
    #rule svg { display: block; width: min(360px, 80vw); height: auto; }
    .tag { display: inline-block; padding: 3px 18px; background: var(--accent); color: #fff; font-size: 13px; letter-spacing: 0.25em; text-transform: uppercase; transform: skewX(-20deg); }
    .tag span { display: inline-block; transform: skewX(20deg); }
    button { font: inherit; color: inherit; background: transparent; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 4px; padding: 4px 12px; cursor: pointer; }
    button:hover { border-color: var(--ink); }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }
    figure { position: relative; margin: 0; }
    figure svg { display: block; width: 100%; height: auto; aspect-ratio: 1; }
    figcaption { position: absolute; left: 0; top: 0; padding: 0 9px; background: var(--accent); color: #fff; font-size: 13px; font-variant-numeric: tabular-nums; transform: skewX(-12deg); }
    /* A white drop shadow on every drawing fakes a bloom. */
    #rule svg, figure svg { filter: drop-shadow(0 0 1.5px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 6px rgba(255, 255, 255, 0.45)); }
    .shape { fill: none; stroke: var(--ink); stroke-width: 1; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .arrow { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    @media (max-width: 520px) {
      body { padding: 24px 16px 48px; }
      #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    }
  </style>
</head>
<body>
<header>
  <h1>Shape Grammar</h1>
  <div id="rule"></div>
  <div class="tag"><span>Shape rule</span></div>
  <button id="again" title="New runs (R)">New runs</button>
</header>
<main id="grid"></main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
