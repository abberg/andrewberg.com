<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Shape Grammar — Andrew Berg</title>
  <style>
    :root { --paper: #E6E5E3; --ink: #2D2A32; --accent: #FB2576; --muted: #7A7680; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
    body { display: grid; grid-template-columns: 250px minmax(0, 1fr); }
    aside { display: flex; flex-direction: column; justify-content: space-between; gap: 16px; padding: 16px; min-height: 0; overflow: auto; }
    #stage { width: 100%; height: 100%; min-height: 0; display: block; }
    .shape { fill: none; stroke: var(--ink); stroke-width: 1.25; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .shape.live { stroke: var(--accent); stroke-width: 1.75; }
    .marker { fill: var(--accent); }
    h1 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
    .tabs, .controls { display: flex; flex-wrap: wrap; gap: 4px; }
    button { font: inherit; color: inherit; background: rgba(255, 255, 255, 0.55); border: 1px solid rgba(45, 42, 50, 0.25); border-radius: 4px; padding: 3px 9px; cursor: pointer; }
    button:hover { background: rgba(255, 255, 255, 0.85); }
    button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .rules { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    .rule { display: grid; grid-template-columns: 72px auto 72px; align-items: center; gap: 6px; }
    .rule svg { width: 72px; height: 72px; display: block; background: rgba(255, 255, 255, 0.45); border-radius: 4px; }
    .rule .arrow { color: var(--muted); }
    .rule .name { grid-column: 1 / -1; color: var(--muted); margin-top: -4px; }
    .step { display: block; margin-top: 6px; color: var(--muted); font-variant-numeric: tabular-nums; }
    @media (max-width: 640px) {
      body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
      aside { flex-direction: row; flex-wrap: wrap; align-items: flex-end; }
      .rules { display: none; }
    }
    html.thumbnail body { grid-template-columns: minmax(0, 1fr); }
    html.thumbnail aside { display: none; }
  </style>
</head>
<body>
<aside>
  <div>
    <h1>Shape Grammar</h1>
    <div class="tabs" id="tabs"></div>
    <div class="rules" id="rules"></div>
  </div>
  <div>
    <div class="controls">
      <button id="prev" title="Previous step (←)">◀</button>
      <button id="play" title="Play or pause (space)">Pause</button>
      <button id="next" title="Next step (→)">▶</button>
      <button id="again" title="New derivation (R)">New</button>
    </div>
    <span class="step" id="step"></span>
  </div>
</aside>
<svg id="stage" preserveAspectRatio="xMidYMid meet"><g id="shapes"></g></svg>
<script type="module" src="./src/main.js"></script>
</body>
</html>
