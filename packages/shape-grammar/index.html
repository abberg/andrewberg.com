<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Shape Grammars — Andrew Berg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Monoton&family=Press+Start+2P&family=Rubik+Mono+One&family=VT323&display=swap">
  <script>
    // Title treatments to compare: ?title=1 to 5. Without it, the plain title.
    document.documentElement.dataset.title = new URLSearchParams(location.search).get("title") ?? "0";
  </script>
  <style>
    :root { --paper: #0A0700; --ink: #FFB000; --muted: #9A6A00; }
    html { background: var(--paper); color: var(--ink); font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    body { box-sizing: border-box; margin: 0 auto; padding: 40px 32px 64px; max-width: 1400px; }
    h1 { margin: 0 0 32px; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; text-shadow: 0 0 6px rgba(255, 160, 0, 0.7); }
    /* 1: a big terminal face, glowing like the drawings. */
    [data-title="1"] h1 { margin-bottom: 40px; text-align: center; font: 400 min(88px, 14vw)/1 "VT323", monospace; letter-spacing: 0.04em; text-transform: uppercase; text-shadow: 0 0 2px #FFC233, 0 0 10px rgba(255, 160, 0, 0.9), 0 0 32px rgba(255, 140, 0, 0.6); }
    /* 2: neon tubes. */
    [data-title="2"] h1 { margin-bottom: 48px; text-align: center; font: 400 min(64px, 9vw)/1.1 "Monoton", sans-serif; letter-spacing: 0.06em; text-shadow: 0 0 4px rgba(255, 176, 0, 0.9), 0 0 18px rgba(255, 140, 0, 0.7), 0 0 44px rgba(255, 120, 0, 0.5); }
    /* 3: a wide geometric mono, all lower case, tracked out. */
    [data-title="3"] h1 { margin-bottom: 48px; text-align: center; font: 400 min(36px, 5.5vw)/1.2 "Major Mono Display", monospace; letter-spacing: 0.35em; text-transform: lowercase; text-shadow: 0 0 3px rgba(255, 176, 0, 0.9), 0 0 16px rgba(255, 140, 0, 0.6); }
    /* 4: outlined letters, lines like the hexagons. */
    [data-title="4"] h1 { margin-bottom: 48px; text-align: center; font: 400 min(60px, 8vw)/1.1 "Rubik Mono One", sans-serif; letter-spacing: 0.04em; color: transparent; -webkit-text-stroke: 1px var(--ink); text-shadow: none; filter: drop-shadow(0 0 2px #FFC233) drop-shadow(0 0 10px rgba(255, 160, 0, 0.7)); }
    /* 5: an 8-bit prompt with a blinking cursor. */
    [data-title="5"] h1 { margin-bottom: 40px; font: 400 min(22px, 4.2vw)/1.4 "Press Start 2P", monospace; text-transform: uppercase; text-shadow: 0 0 2px #FFC233, 0 0 12px rgba(255, 150, 0, 0.8); }
    [data-title="5"] h1::before { content: "> "; }
    [data-title="5"] h1::after { content: ""; display: inline-block; width: 0.7em; height: 1em; margin-left: 0.3em; vertical-align: -0.1em; background: var(--ink); box-shadow: 0 0 10px rgba(255, 150, 0, 0.8); animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { [data-title="5"] h1::after { animation: none; } }
    header { display: flex; flex-direction: column; align-items: center; gap: 24px; margin-bottom: 56px; }
    .rule { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px 64px; width: 100%; }
    .rule svg { display: block; width: min(320px, 100%); height: auto; }
    /* Pages of rows at one level of complexity, set apart by a wider gap. */
    #rows { display: flex; flex-direction: column; gap: 120px; }
    .page { display: flex; flex-direction: column; gap: 24px; }
    #more { height: 1px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
    figure { margin: 0; }
    figure svg { display: block; width: 100%; height: auto; aspect-ratio: 1; }
    /* Amber drop shadows on every drawing fake the bloom of an old amber monitor. */
    .rule svg, figure svg { filter: drop-shadow(0 0 1px #FFC233) drop-shadow(0 0 3px #FFB000) drop-shadow(0 0 10px rgba(255, 160, 0, 0.8)) drop-shadow(0 0 28px rgba(255, 140, 0, 0.55)); }
    .shape { fill: none; stroke: var(--ink); stroke-width: 1; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .arrow { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    @media (max-width: 760px) {
      body { padding: 24px 16px 48px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    }
  </style>
</head>
<body>
<h1>Shape Grammars</h1>
<header>
  <div class="rule" id="rule"></div>
</header>
<main id="rows"></main>
<div id="more"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
