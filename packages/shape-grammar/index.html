<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Shape Grammars — Andrew Berg</title>
  <style>
    :root { --paper: #000; --ink: #fff; --muted: #8A8A8A; }
    html { background: var(--paper); color: var(--ink); font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    body { box-sizing: border-box; margin: 0 auto; padding: 40px 32px 64px; max-width: 1400px; }
    h1 { margin: 0 0 32px; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
    section { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(0, 2.4fr); column-gap: 56px; align-items: center; padding: 32px 0; }
    section header { display: flex; flex-direction: column; align-items: center; gap: 24px; }
    .rule { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 360px; }
    .rule svg { display: block; width: 100%; height: auto; }
    button { font: inherit; color: inherit; background: transparent; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 4px; padding: 4px 12px; cursor: pointer; }
    button:hover { border-color: var(--ink); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
    figure { margin: 0; }
    figure svg { display: block; width: 100%; height: auto; aspect-ratio: 1; }
    /* A white drop shadow on every drawing fakes a bloom. */
    .rule svg, figure svg { filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 3px #fff) drop-shadow(0 0 10px rgba(255, 255, 255, 0.8)) drop-shadow(0 0 28px rgba(255, 255, 255, 0.55)); }
    .shape { fill: none; stroke: var(--ink); stroke-width: 1; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .arrow { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    @media (max-width: 760px) {
      body { padding: 24px 16px 48px; }
      section { grid-template-columns: minmax(0, 1fr); row-gap: 24px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    }
  </style>
</head>
<body>
<h1>Shape Grammars</h1>
<main id="rules"></main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
