<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Shape Grammar — Andrew Berg</title>
  <style>
    :root { --paper: #000; --ink: #fff; --muted: #8A8A8A; }
    html { background: var(--paper); color: var(--ink); font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    body { box-sizing: border-box; margin: 0 auto; padding: 40px 32px; max-width: 1400px; min-height: 100vh; display: grid; grid-template-columns: minmax(220px, 1fr) minmax(0, 2.4fr); gap: 56px; align-items: center; }
    header { display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }
    h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
    #rule, #rule svg { display: block; width: 100%; max-width: 360px; height: auto; }
    button { font: inherit; color: inherit; background: transparent; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 4px; padding: 4px 12px; cursor: pointer; }
    button:hover { border-color: var(--ink); }
    #grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
    figure { margin: 0; }
    figure svg { display: block; width: 100%; height: auto; aspect-ratio: 1; }
    /* A white drop shadow on every drawing fakes a bloom. */
    #rule svg, figure svg { filter: drop-shadow(0 0 1.5px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 6px rgba(255, 255, 255, 0.45)); }
    .shape { fill: none; stroke: var(--ink); stroke-width: 1; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .arrow { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    @media (max-width: 760px) {
      body { padding: 24px 16px 48px; grid-template-columns: minmax(0, 1fr); gap: 32px; align-items: start; }
      #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    }
  </style>
</head>
<body>
<header>
  <h1>Shape Grammar</h1>
  <div id="rule"></div>
  <button id="again" title="Regenerate (R)">Regenerate</button>
</header>
<main id="grid"></main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
