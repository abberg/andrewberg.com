<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Shape Grammars — Andrew Berg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend+Exa:wght@200;300&family=Major+Mono+Display&family=Michroma&family=Orbitron:wght@400&family=Syncopate&family=Space+Mono&display=swap">
  <script>
    // Title treatments to compare: ?title=1 to 6. Without it, the plain title.
    document.documentElement.dataset.title = new URLSearchParams(location.search).get("title") ?? "0";
  </script>
  <style>
    :root { --paper: #0A0700; --ink: #FFB000; --muted: #9A6A00; }
    html { background: var(--paper); color: var(--ink); font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    body { box-sizing: border-box; margin: 0 auto; padding: 40px 32px 64px; max-width: 1400px; }
    h1 { margin: 0 0 32px; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; text-shadow: 0 0 6px rgba(255, 160, 0, 0.7); }
    /* Spaced geometric titles: small, tracked out wide, softly glowing. */
    [data-title]:not([data-title="0"]) h1 { margin-bottom: 48px; text-align: center; text-shadow: 0 0 3px rgba(255, 176, 0, 0.9), 0 0 16px rgba(255, 140, 0, 0.6); }
    /* 1: the one you liked, Major Mono Display. */
    [data-title="1"] h1 { font: 400 min(36px, 5.5vw)/1.2 "Major Mono Display", monospace; letter-spacing: 0.35em; text-transform: lowercase; }
    /* 2: Syncopate, wide flat capitals. */
    [data-title="2"] h1 { font: 400 min(30px, 4.6vw)/1.2 "Syncopate", sans-serif; letter-spacing: 0.4em; text-transform: uppercase; }
    /* 3: Michroma, squared-off and technical. */
    [data-title="3"] h1 { font: 400 min(28px, 4.4vw)/1.2 "Michroma", sans-serif; letter-spacing: 0.45em; text-transform: uppercase; }
    /* 4: Lexend Exa at a hairline weight. */
    [data-title="4"] h1 { font: 200 min(38px, 5.8vw)/1.2 "Lexend Exa", sans-serif; letter-spacing: 0.3em; text-transform: uppercase; }
    /* 5: Orbitron, rounded-square sci-fi. */
    [data-title="5"] h1 { font: 400 min(32px, 5vw)/1.2 "Orbitron", sans-serif; letter-spacing: 0.5em; text-transform: uppercase; }
    /* 6: Space Mono, plainer, lower case, very wide. */
    [data-title="6"] h1 { font: 400 min(30px, 4.6vw)/1.2 "Space Mono", monospace; letter-spacing: 0.6em; text-transform: lowercase; }
    header { display: flex; flex-direction: column; align-items: center; gap: 24px; margin-bottom: 56px; }
    .rule { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px 64px; width: 100%; }
    .rule svg { display: block; width: min(320px, 100%); height: auto; }
    /* Pages of rows at one level of complexity, set apart by a wider gap. */
    #rows { display: flex; flex-direction: column; gap: 120px; }
    .page { display: flex; flex-direction: column; gap: 24px; }
    #more { height: 1px; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
    figure { margin: 0; }
    figure svg { display: block; width: 100%; height: auto; aspect-ratio: 1; }
    /* Amber drop shadows on every drawing fake the bloom of an old amber monitor. */
    .rule svg, figure svg { filter: drop-shadow(0 0 1px #FFC233) drop-shadow(0 0 3px #FFB000) drop-shadow(0 0 10px rgba(255, 160, 0, 0.8)) drop-shadow(0 0 28px rgba(255, 140, 0, 0.55)); }
    .shape { fill: none; stroke: var(--ink); stroke-width: 1; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .arrow { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    @media (max-width: 760px) {
      body { padding: 24px 16px 48px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    }
  </style>
</head>
<body>
<h1>Shape Grammars</h1>
<header>
  <div class="rule" id="rule"></div>
</header>
<main id="rows"></main>
<div id="more"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
