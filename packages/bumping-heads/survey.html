<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bumping Heads survey</title>
  <!-- A contact sheet of the heads scripts/survey-heads.mjs wrote to survey/, in dev only. -->
  <style>
    body { margin: 0; background: #16181c; color: #c9ccd2; font: 11px/1.3 ui-monospace, Menlo, monospace; }
    #sheet { display: grid; grid-template-columns: repeat(auto-fill, 160px); }
    figure { margin: 0 0 8px; text-align: center; }
    canvas { display: block; }
  </style>
</head>
<body>
<div id="sheet"></div>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
  import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';

  const heads = await (await fetch('survey/list.json')).json();
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(160, 160);
  const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(4, 2, 9);
  camera.lookAt(0, 0, 0);
  for (const head of heads) {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#16181c');
    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(3, 5, 6);
    scene.add(light, (await loader.loadAsync(`survey/${head.code}.glb`)).scene);
    renderer.render(scene, camera);
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 160;
    canvas.getContext('2d').drawImage(renderer.domElement, 0, 0);
    const figure = document.createElement('figure');
    figure.append(canvas, `${head.code} ${head.name} (${head.size.join(' × ')})`);
    figure.title = head.series;
    document.getElementById('sheet').append(figure);
  }
</script>
</body>
</html>
