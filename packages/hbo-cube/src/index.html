<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story Cube — Andrew Berg</title>
<link rel="icon" href="data:,">
<meta name="description" content="A recreation of the HBO Imagine story cube: one looping scene seen from four sides.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #070708; color: #e8e8e4; font: 700 10px/1 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: .04em; text-transform: uppercase; overflow: hidden; }
  .app { position: relative; height: 100%; background:
    radial-gradient(60% 55% at 30% 30%, #1d1d1f 0%, transparent 70%),
    radial-gradient(50% 60% at 78% 62%, #18181a 0%, transparent 70%),
    radial-gradient(90% 80% at 50% 50%, #101011 0%, #070708 100%); }
  .gl { position: absolute; left: 0; top: 36px; width: 100%; height: calc(100% - 36px - 66px); touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; outline: none; }
  .gl.dragging { cursor: grabbing; }
  .gl:focus-visible { outline: 1px solid #ffffff55; outline-offset: -1px; }
  button { display: inline-grid; place-items: center; grid-auto-flow: column; gap: 8px; margin: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  svg { display: block; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tile { display: grid; place-items: center; width: 34px; height: 34px; background: #19191b; box-shadow: inset 0 1px 0 #ffffff12, 0 1px 6px #0009; color: #cfcfca; transition: color .15s, background .15s; }
  button:hover .tile, button.tile:hover { color: #fff; background: #29292c; }

  .views { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); display: flex; background: #19191b; box-shadow: inset 0 1px 0 #ffffff12; }
  .views button { width: 32px; height: 28px; color: #6f6f6a; }
  .views button + button { border-left: 1px dotted #ffffff40; }
  .views button[aria-pressed="true"], .views button:hover { color: #fff; }

  .spin { position: absolute; top: calc(36px + (100% - 102px) / 2); transform: translateY(-50%); z-index: 2; }
  .spin.left { left: 3.5%; }
  .spin.right { right: 3.5%; }
  .spin svg { width: 18px; height: 18px; stroke-width: 2.4; }

  .controls { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; white-space: nowrap; z-index: 2; }
  .controls .share { color: #77776f; }
  .controls .share:hover { color: #fff; }
  .controls .play svg { fill: currentColor; stroke: none; }
  .controls .mute { width: 20px; height: 20px; color: #cfcfca; }
  .controls .mute:hover { color: #fff; }
  .time { font-variant-numeric: tabular-nums; min-width: 9ch; }

  .unlock { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .tagline { position: relative; font-size: 12px; letter-spacing: .14em; color: #3a3a3c; }
  .tagline .lit { position: absolute; inset: 0 auto 0 0; width: 0; overflow: hidden; color: #fff; text-shadow: 0 0 8px #fffc; transition: width .9s ease; }
  .meter { position: relative; width: 84px; height: 8px; border-bottom: 1px dotted #ffffff66; }
  .meter i { position: absolute; left: 0; bottom: -1px; height: 1px; width: 0; background: #fff; box-shadow: 0 0 6px #fff; transition: width .9s ease; }

  .map { position: absolute; inset: 36px 0 66px; display: grid; place-items: center; background: #070708eb; z-index: 3; }
  .map[hidden] { display: none; }
  .map svg { width: auto; height: 100%; max-width: 100%; stroke-width: .12; }
  .map .room { stroke: #55555a; }
  .map .wall { stroke: #8a8a85; stroke-width: .3; }
  .map .column { fill: #e8e8e4; stroke: none; }
  .map text { fill: #77776f; stroke: none; font: 400 1.5px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
  .map .cam { cursor: pointer; color: #5c5c5f; }
  .map .cam.seen { color: #cfcfca; }
  .map .cam.current, .map .cam:hover, .map .cam:focus-visible { color: #fff; outline: none; }
  .map .cam .cone { fill: currentColor; fill-opacity: .12; stroke: currentColor; stroke-opacity: .5; }
  .map .cam.current .cone { fill-opacity: .28; }
  .map .cam circle { fill: #19191b; stroke: currentColor; stroke-width: .16; }
  .map .cam text { fill: currentColor; font-size: 1.6px; }

  .hint, .toast { position: absolute; left: 50%; transform: translateX(-50%); margin: 0; padding: 7px 12px; background: #000000b3; color: #fff; white-space: nowrap; pointer-events: none; transition: opacity .4s; z-index: 4; }
  .hint { bottom: 76px; }
  .turned .hint { opacity: 0; }
  .toast { top: 44px; opacity: 0; }
  .toast.show { opacity: 1; }
  .fallback { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; }
  video { display: none; }

  @media (max-width: 560px) {
    .spin span, .tagline { display: none; }
    .spin.left { left: 4px; } .spin.right { right: 4px; }
    .tile { width: 30px; height: 30px; }
    .controls { gap: 8px; }
  }
</style>
</head>
<body>
<div class="app">
  <canvas class="gl" tabindex="0" role="img" aria-label="Story cube showing four views of one scene. Use the left and right arrow keys to turn it."></canvas>

  <div class="views" role="group" aria-label="View">
    <button type="button" data-view="cube" aria-pressed="true" aria-label="Cube view">
      <svg viewBox="0 0 16 16"><path d="M8 1.8 13.6 5v6L8 14.2 2.4 11V5zM2.4 5 8 8.2 13.6 5M8 8.2v6"/></svg>
    </button>
    <button type="button" data-view="map" aria-pressed="false" aria-label="Map view">
      <svg viewBox="0 0 16 16"><path d="M8 8 3.2 3.6M8 8l4.6-4M8 8l5 3.6M8 8l-4.4 4.6M8 8V2"/><g fill="currentColor" stroke="none"><circle cx="8" cy="8" r="1.7"/><circle cx="3.2" cy="3.6" r="1.2"/><circle cx="12.6" cy="4" r="1.2"/><circle cx="13" cy="11.6" r="1.2"/><circle cx="3.6" cy="12.6" r="1.2"/><circle cx="8" cy="2" r="1"/></g></svg>
    </button>
  </div>

  <button type="button" class="spin left" data-turn="1" aria-label="Spin left">
    <span>Spin</span>
    <span class="tile"><svg viewBox="0 0 18 18"><path d="M4.5 11.5A5.5 5.5 0 1 1 13 12.5"/><path d="M14.2 8.4 13 13l-4.4-1.2"/></svg></span>
  </button>
  <button type="button" class="spin right" data-turn="-1" aria-label="Spin right">
    <span class="tile"><svg viewBox="0 0 18 18" style="transform: scaleX(-1)"><path d="M4.5 11.5A5.5 5.5 0 1 1 13 12.5"/><path d="M14.2 8.4 13 13l-4.4-1.2"/></svg></span>
    <span>Spin</span>
  </button>

  <div class="controls">
    <span>The Heist</span>
    <button type="button" class="share">Share</button>
    <button type="button" class="play tile" aria-label="Pause"><svg viewBox="0 0 16 16"><path d=""/></svg></button>
    <span class="time">00:00/00:00</span>
    <button type="button" class="mute" aria-label="Unmute" aria-pressed="true"><svg viewBox="0 0 16 16"><path d=""/></svg></button>
  </div>

  <div class="unlock" role="status">
    <span class="tagline" aria-hidden="true"><span class="lit">It&rsquo;s more than you imagined</span>It&rsquo;s more than you imagined</span>
    <span class="percent">0% unlocked</span>
    <span class="meter" aria-hidden="true"><i></i></span>
  </div>

  <div class="map" hidden></div>
  <p class="hint">Drag to turn the cube</p>
  <p class="toast" role="status"></p>
</div>
<video muted loop playsinline preload="auto">
  <source src="gallery.mp4" type="video/mp4">
  <source src="gallery.webm" type="video/webm">
</video>
<script src="assets/three.min.js"></script>
<script src="main.js"></script>
</body>
</html>
