<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parallax Rings — Andrew Berg</title>
<link rel="icon" href="data:,">
<meta name="description" content="How the Sidekick 3 street looped: each layer is a ring of tiles sized to the speed it scrolls at.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #F5F5F1; color: #16181A; font: 12px/1.35 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; overflow: hidden; }
  .app { display: grid; grid-template-rows: minmax(0, 1.5fr) minmax(0, 1fr); height: 100%; }
  .stage { position: relative; min-height: 0; border-bottom: 1px solid #16181A; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; outline: none; }
  .stage canvas.dragging { cursor: grabbing; }
  .stage canvas:focus-visible { outline: 2px solid #16181A; outline-offset: -2px; }
  .hint { position: absolute; left: 10px; top: 10px; margin: 0; padding: 4px 8px; background: #16181A; color: #F5F5F1; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; pointer-events: none; transition: opacity .4s; }
  .hint.gone { opacity: 0; }
  .panel { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 20px; align-items: center; justify-content: center; min-height: 0; padding: 14px 16px; }
  .ringbox { position: relative; align-self: stretch; aspect-ratio: 1; min-height: 0; }
  .ringbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .info { display: flex; flex-direction: column; gap: 12px; min-width: 0; max-width: 430px; }
  .legend { display: grid; grid-template-columns: auto auto auto auto; justify-content: start; gap: 4px 14px; margin: 0; padding: 0; list-style: none; font-variant-numeric: tabular-nums; }
  .legend li { display: contents; }
  .legend i { width: 12px; height: 12px; align-self: center; border: 1.5px solid #16181A; }
  .legend .n, .legend .r { text-align: right; color: #5E635E; }
  .legend .r.off { color: #B3261E; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; }
  button { margin: 0; padding: 5px 9px 5px 26px; position: relative; border: 1.5px solid #16181A; border-radius: 0; background: none; color: inherit; font: inherit; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; }
  button::before { content: ''; position: absolute; left: 8px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border: 1.5px solid #16181A; }
  button[aria-pressed="true"]::before { background: #16181A; }
  button:focus-visible { outline: 2px solid #16181A; outline-offset: 2px; }
  .status { margin: 0; color: #5E635E; font-family: system-ui, sans-serif; font-size: 13px; line-height: 1.4; min-height: 2.8em; }
  @media (max-width: 560px) {
    .panel { gap: 12px; padding: 8px 10px; }
    .info { gap: 7px; }
    body { font-size: 10px; }
    .legend { gap: 2px 8px; }
    .legend i { width: 9px; height: 9px; }
    .toggles { flex-wrap: nowrap; gap: 5px; }
    button { padding: 3px 5px 3px 18px; font-size: 9px; letter-spacing: 0; white-space: nowrap; }
    button::before { left: 5px; width: 8px; height: 8px; margin-top: -4px; }
    .status { font-size: 11px; min-height: 0; }
  }
  @media (max-height: 340px) { .status, .hint { display: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="scene" tabindex="0" role="img" aria-label="An illustrated street in four layers that scroll at different speeds. Drag or use the arrow keys to walk along it."></canvas>
    <p class="hint" id="hint">Drag, or use the arrow keys</p>
  </div>
  <div class="panel">
    <div class="ringbox"><canvas id="rings" role="img" aria-label="The four layers drawn as rings of tiles around the viewer. The tiles in view are filled in."></canvas></div>
    <div class="info">
      <ul class="legend" id="legend"></ul>
      <div class="toggles">
        <button type="button" id="tiles" aria-pressed="true">Show tiles</button>
        <button type="button" id="fit" aria-pressed="true">Size rings to speed</button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </div>
  </div>
</div>
<script src="./main.js"></script>
</body>
</html>
